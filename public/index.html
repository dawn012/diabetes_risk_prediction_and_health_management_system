<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diatrack - Diabetes Management</title>

  <style>
    .type-subscription { background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%); }
    .type-receipt { background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); }
    .type-payment { background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); }
    .type-community { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

    body {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        max-width: 400px;
        margin: 20px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
        font-size: 48px;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 28px;
        font-weight: 600;
        margin: 0 0 10px;
        background: linear-gradient(45deg, #fff, #f0f0f0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .subtitle {
        font-size: 16px;
        opacity: 0.8;
        margin-bottom: 30px;
    }

    .info-box {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 20px;
        margin: 20px 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .item-id {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #FFD700;
    }

    .button {
        display: inline-block;
        background: linear-gradient(45deg, #4CAF50, #45a049);
        color: white;
        padding: 15px 30px;
        border-radius: 25px;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        margin: 10px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .button.secondary {
        background: linear-gradient(45deg, #2196F3, #1976D2);
    }

    .status {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 14px;
    }

    .loading {
        color: #FFD700;
    }

    .success {
        color: #4CAF50;
    }

    .error {
        color: #f44336;
    }

    .spinner {
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 2px solid #FFD700;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .footer {
        margin-top: 30px;
        font-size: 12px;
        opacity: 0.6;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="logo" id="page-logo">💬</div>
  <h1 id="page-title">Diatrack</h1>
  <div class="subtitle" id="page-subtitle">Diabetes Support & Discussion</div>

  <div id="content-section" style="display: none;">
    <div class="info-box">
      <div id="content-type"></div>
      <div class="item-id" id="item-id"></div>
      <div id="additional-info"></div>
    </div>
  </div>

  <div id="buttons">
    <a href="#" id="open-app-btn" class="button" style="display: none;">Open in Diatrack App</a>
    <a href="#" id="try-again-btn" class="button secondary" style="display: none;">Try Again</a>
  </div>

  <div class="status" id="status">
    <div class="spinner"></div>
    <div class="loading" id="loading-message">Opening Diatrack App...</div>
  </div>

  <div class="footer">
    Please install the Diatrack mobile app to view this content
  </div>
</div>

<script>
  class DiatrackDeepLinkHandler {
      constructor() {
          this.itemId = null;
          this.linkType = null;
          this.hasTriedApp = false;
          this.init();
      }

      init() {
          this.extractLinkInfo();
          this.setupEventListeners();
          this.attemptAppLaunch();
      }

      extractLinkInfo() {
          const path = window.location.pathname;
          console.log('Current path:', path);

          // 支持多种类型的链接
          const patterns = [
              // Community posts
              { pattern: /\/(?:community\/)?post\/([^\/]+)/, type: 'community', logo: '💬', title: 'Diatrack Community', subtitle: 'Diabetes Support & Discussion' },
              // Subscription management
              { pattern: /\/subscription\/([^\/]+)/, type: 'subscription', logo: '📋', title: 'Subscription Details', subtitle: 'Manage Your Plan' },
              // Receipt viewing
              { pattern: /\/receipt\/([^\/]+)/, type: 'receipt', logo: '🧾', title: 'Payment Receipt', subtitle: 'View Your Transaction' },
              // Payment handling
              { pattern: /\/payment\/([^\/]+)/, type: 'payment', logo: '💳', title: 'Payment', subtitle: 'Complete Your Transaction' },
              // Subscription renewal
              { pattern: /\/subscription\/([^\/]+)\/renew/, type: 'renewal', logo: '🔄', title: 'Renew Subscription', subtitle: 'Continue Your Plan' },
              // Subscription reactivation
              { pattern: /\/subscription\/([^\/]+)\/reactivate/, type: 'reactivate', logo: '⚡', title: 'Reactivate Subscription', subtitle: 'Restart Your Plan' }
          ];

          for (const { pattern, type, logo, title, subtitle } of patterns) {
              const match = path.match(pattern);
              if (match && match[1]) {
                  this.itemId = match[1];
                  this.linkType = type;

                  // 更新页面内容
                  document.getElementById('page-logo').textContent = logo;
                  document.getElementById('page-title').textContent = title;
                  document.getElementById('page-subtitle').textContent = subtitle;
                  document.getElementById('item-id').textContent = this.itemId;
                  document.getElementById('content-type').textContent = this.getContentTypeText(type);
                  document.getElementById('content-section').style.display = 'block';

                  // 更新背景颜色基于类型
                  document.body.className = `type-${type}`;

                  console.log(`Detected ${type} link with ID: ${this.itemId}`);
                  return;
              }
          }

          // 如果没有匹配到任何模式，显示默认页面
          console.log('No specific deep link pattern matched');
      }

      getContentTypeText(type) {
          const typeTexts = {
              'community': 'Community Post',
              'subscription': 'Subscription',
              'receipt': 'Payment Receipt',
              'payment': 'Payment',
              'renewal': 'Subscription Renewal',
              'reactivate': 'Subscription Reactivation'
          };
          return typeTexts[type] || 'Content';
      }

      setupEventListeners() {
          document.getElementById('open-app-btn').addEventListener('click', (e) => {
              e.preventDefault();
              this.openApp();
          });

          document.getElementById('try-again-btn').addEventListener('click', (e) => {
              e.preventDefault();
              this.attemptAppLaunch();
          });

          document.addEventListener('visibilitychange', () => {
              if (document.hidden && this.hasTriedApp) {
                  this.showSuccess();
              }
          });
      }

      attemptAppLaunch() {
          if (!this.itemId || !this.linkType) {
              this.showError('No valid content found in URL');
              return;
          }

          this.showLoading('Opening Diatrack App...');
          this.hasTriedApp = true;

          // 根据类型生成不同的 deep link
          const deepLinkUrl = this.generateDeepLinkUrl();
          const fallbackUrl = this.generateFallbackUrl();

          // 尝试两种 scheme
          this.openDeepLink(deepLinkUrl);

          // 3秒后检查是否还在页面
          setTimeout(() => {
              if (!document.hidden) {
                  this.showFallback();
              }
          }, 3000);
      }

      generateDeepLinkUrl() {
          // 自定义 scheme
          switch (this.linkType) {
              case 'community':
                  return `diatrack://community/post/${this.itemId}`;
              case 'subscription':
                  return `diatrack://subscription/${this.itemId}`;
              case 'receipt':
                  return `diatrack://receipt/${this.itemId}`;
              case 'payment':
                  return `diatrack://payment/${this.itemId}`;
              case 'renewal':
                  return `diatrack://subscription/${this.itemId}/renew`;
              case 'reactivate':
                  return `diatrack://subscription/${this.itemId}/reactivate`;
              default:
                  return `diatrack://${this.linkType}/${this.itemId}`;
          }
      }

      generateFallbackUrl() {
          // HTTPS fallback
          return `https://diabetes-health-system.web.app${window.location.pathname}`;
      }

      openApp() {
          if (this.itemId && this.linkType) {
              const deepLinkUrl = this.generateDeepLinkUrl();
              this.openDeepLink(deepLinkUrl);
          }
      }

      openDeepLink(url) {
          console.log('Opening deep link:', url);
          window.location.href = url;

          setTimeout(() => {
              const iframe = document.createElement('iframe');
              iframe.style.display = 'none';
              iframe.src = url;
              document.body.appendChild(iframe);
              setTimeout(() => {
                  document.body.removeChild(iframe);
              }, 1000);
          }, 500);
      }

      showLoading(message) {
          const status = document.getElementById('status');
          status.innerHTML = `
              <div class="spinner"></div>
              <div class="loading">${message}</div>
          `;
          this.hideButtons();
      }

      showSuccess() {
          const status = document.getElementById('status');
          status.innerHTML = `<div class="success">✓ Successfully opened in Diatrack App!</div>`;
          this.hideButtons();
      }

      showError(message) {
          const status = document.getElementById('status');
          status.innerHTML = `<div class="error">✗ ${message}</div>`;
          this.showButtons();
      }

      showFallback() {
          const status = document.getElementById('status');
          status.innerHTML = `
              <div class="error">
                  ⚠️ Diatrack App not found or failed to open<br>
                  <small>Please make sure the Diatrack app is installed on your device</small>
              </div>
          `;
          this.showButtons();
      }

      hideButtons() {
          document.getElementById('open-app-btn').style.display = 'none';
          document.getElementById('try-again-btn').style.display = 'none';
      }

      showButtons() {
          if (this.itemId) {
              document.getElementById('open-app-btn').style.display = 'inline-block';
          }
          document.getElementById('try-again-btn').style.display = 'inline-block';
      }
  }

  // 页面加载完成后初始化
  document.addEventListener('DOMContentLoaded', () => {
      new DiatrackDeepLinkHandler();
  });

  // 处理页面焦点变化
  let startTime = Date.now();
  window.addEventListener('blur', () => {
      startTime = Date.now();
  });

  window.addEventListener('focus', () => {
      const timeElapsed = Date.now() - startTime;
      if (timeElapsed < 2000) {
          document.getElementById('status').innerHTML =
              `<div class="success">✓ Welcome back! App launch detected.</div>`;
      }
  });
</script>
</body>
</html>
