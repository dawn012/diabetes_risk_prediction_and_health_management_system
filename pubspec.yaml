name: diabetes_risk_prediction_and_health_management_system
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  #-- UTILITY PACKAGES
  http: ^1.3.0
  intl: ^0.20.2
  logger: ^2.5.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.2
  flutter_native_splash: ^2.4.4
  smooth_page_indicator: ^1.2.0+3
  liquid_swipe: ^3.1.0
  flutter_holo_date_picker: ^2.0.0  # birthday date picker
  jiffy: ^6.3.2  # formatting dates and time ago
  uuid: ^4.5.1  # generating ids for users
  fluttertoast: ^8.2.12  # show toast message
  fl_chart: ^1.0.0
  flutter_staggered_animations: ^1.1.1
  pdf: ^3.11.3
  printing: ^5.14.2
  permission_handler: ^12.0.1
  share_plus: ^11.1.0
  device_info_plus: ^11.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  app_links: ^6.4.1
  dotted_border: ^3.1.0
  confetti: ^0.8.0
  universal_html: ^2.3.0
  showcaseview: ^5.0.1

  #-- MEDIA PROCESSING PACKAGES
  image_picker: ^1.1.2  # pick images
  video_player: ^2.9.2  # play videos
  story_view: ^0.16.5  # for displaying the stories
  flutter_image_compress: ^2.4.0
  video_compress: ^3.1.4
  video_thumbnail: ^0.5.6
  camera: ^0.10.3+2
  cached_network_image: ^3.4.1

  #-- STATE MANAGEMENT PACKAGES
  get: ^4.6.6
  get_storage: ^2.1.1
  flutter_riverpod: ^2.6.1

  #-- HIVE
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  #-- SOCIAL MEDIA LOGIN PACKAGES
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  #-- PAYMENT METHOD
  flutter_stripe: ^11.5.0

  #-- FIREBASE PACKAGES
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_analytics: ^11.4.0
  firebase_app_check: ^0.3.2+1
  cloud_firestore: ^5.6.2
  cloud_functions: ^5.6.2
  firebase_storage: ^12.4.3
  firebase_messaging: ^15.2.10
#  firebase_admin: ^0.3.0+1

  #-- ICON PACKAGES
  cupertino_icons: ^1.0.8
  icons_plus: ^5.0.0
  font_awesome_flutter: ^10.8.0
  flutter_svg: ^2.0.17

  #-- TRACK STEP
  pedometer: ^4.1.1
  health: ^13.1.4

  # PRODUCT SPECIFIC PACKAGES
#  readmore: ^3.0.0
#  carousel_slider: ^5.0.0
#  flutter_rating_bar: ^4.0.1

  google_fonts: ^6.2.1
  flutter_otp_text_field: ^1.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.6

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ----------------- LOCAL ASSETS -----------------
  assets:
    - assets/images/
    - assets/videos/
    - assets/logos/
    - assets/icons/
    - assets/images/splash_images/
    - assets/images/on_boarding_images/
    - assets/images/welcome/
    - assets/images/forget_password/
    - assets/images/animations/
    - assets/images/user/

  # ----------------- LOCAL FONTS -----------------
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 800
          style: italic

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
